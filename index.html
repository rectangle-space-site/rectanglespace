<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rectangle Space — Movie Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12100D;
    --ink-2:#1B1812;
    --paper:#EDE6D6;
    --paper-dim:#B8B0A0;
    --amber:#E8A33D;
    --amber-dim:#8A6229;
    --teal:#2F6E68;
    --rule:#3A362E;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--paper);
    font-family:'Newsreader', serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--amber);color:var(--ink);}

  /* ---------- Hero: countdown leader ---------- */
  .hero{
    position:relative;
    padding:6rem 1.5rem 4rem;
    text-align:center;
    border-bottom:1px solid var(--rule);
    overflow:hidden;
  }
  .leader{
    font-family:'IBM Plex Mono', monospace;
    font-size:.85rem;
    letter-spacing:.3em;
    color:var(--paper-dim);
    display:flex;
    justify-content:center;
    gap:1.2rem;
    margin-bottom:2rem;
  }
  .leader span{opacity:.35;}
  .leader span.active{opacity:1;color:var(--amber);}
  h1.title{
    font-family:'Bebas Neue', sans-serif;
    font-size:clamp(3rem, 10vw, 6.5rem);
    letter-spacing:.06em;
    margin:0;
    line-height:.95;
    color:var(--paper);
  }
  h1.title em{
    font-style:normal;
    color:var(--amber);
  }
  .tagline{
    font-family:'IBM Plex Mono', monospace;
    font-size:.8rem;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--paper-dim);
    margin-top:1rem;
  }

  /* ---------- Filter bar ---------- */
  .filters{
    display:flex;
    justify-content:center;
    gap:.75rem;
    padding:2rem 1.5rem 0;
    flex-wrap:wrap;
  }
  .filters button{
    font-family:'IBM Plex Mono', monospace;
    font-size:.75rem;
    letter-spacing:.15em;
    text-transform:uppercase;
    background:none;
    border:1px solid var(--rule);
    color:var(--paper-dim);
    padding:.5rem 1rem;
    cursor:pointer;
    transition:border-color .2s, color .2s;
  }
  .filters button:hover,
  .filters button.on{
    border-color:var(--amber);
    color:var(--amber);
  }

  /* ---------- Grid ---------- */
  .grid{
    max-width:1100px;
    margin:0 auto;
    padding:3rem 1.5rem 6rem;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(320px, 1fr));
    gap:2.5rem;
  }

  /* ---------- Card: film-canister spec sheet ---------- */
  .card{
    position:relative;
    background:var(--ink-2);
    border:1px solid var(--rule);
    padding-left:2.1rem;
    overflow:hidden;
  }
  .sprockets{
    position:absolute;
    left:0; top:0; bottom:0;
    width:2.1rem;
    background:repeating-linear-gradient(
      to bottom,
      var(--ink) 0px, var(--ink) 14px,
      transparent 14px, transparent 28px
    );
    border-right:1px solid var(--rule);
  }
  .sprockets::before{
    content:"";
    position:absolute;
    left:.55rem; top:0; bottom:0;
    width:1rem;
    background-image:repeating-linear-gradient(
      to bottom,
      var(--ink-2) 0px, var(--ink-2) 8px,
      transparent 8px, transparent 22px
    );
    border-radius:2px;
  }

  .card-head{
    padding:1.5rem 1.5rem 1rem;
    border-bottom:1px dashed var(--rule);
  }
  .status{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size:.65rem;
    letter-spacing:.2em;
    text-transform:uppercase;
    padding:.2rem .55rem;
    border:1px solid currentColor;
    margin-bottom:.9rem;
  }
  .status.classic{color:var(--amber);}
  .status.upcoming{color:var(--teal);}

  .card h2{
    font-family:'Bebas Neue', sans-serif;
    font-size:1.9rem;
    letter-spacing:.03em;
    margin:0 0 .2rem;
    color:var(--paper);
  }
  .card .year-dir{
    font-family:'IBM Plex Mono', monospace;
    font-size:.75rem;
    color:var(--paper-dim);
    letter-spacing:.05em;
  }

  .synopsis{
    padding:1rem 1.5rem;
    font-size:.95rem;
    line-height:1.55;
    color:var(--paper-dim);
    font-style:italic;
    border-bottom:1px dashed var(--rule);
  }

  .specs{
    padding:1rem 1.5rem 1.5rem;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:.9rem 1rem;
  }
  .spec{
    display:flex;
    flex-direction:column;
    gap:.15rem;
  }
  .spec .label{
    font-family:'IBM Plex Mono', monospace;
    font-size:.62rem;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--amber-dim);
  }
  .spec .value{
    font-family:'IBM Plex Mono', monospace;
    font-size:.95rem;
    color:var(--paper);
  }
  .spec.wide{grid-column:1 / -1;}

  footer{
    text-align:center;
    padding:2.5rem 1.5rem 4rem;
    font-family:'IBM Plex Mono', monospace;
    font-size:.7rem;
    letter-spacing:.15em;
    color:var(--rule);
    text-transform:uppercase;
  }

  @media (max-width:480px){
    .specs{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<section class="hero">
  <div class="leader" id="leader">
    <span>8</span><span>7</span><span>6</span><span>5</span><span>4</span><span>3</span><span>2</span><span>1</span>
  </div>
  <h1 class="title">RECTANGLE <em>SPACE</em></h1>
  <p class="tagline">A running log of classic &amp; upcoming films</p>
</section>

<div class="filters">
  <button class="on" data-filter="all">All</button>
  <button data-filter="classic">Classic</button>
  <button data-filter="upcoming">Upcoming</button>
</div>

<div class="grid" id="grid"></div>

<footer>Rectangle Space — frame by frame</footer>

<script>
/* ---------------------------------------------------------
   MOVIE DATA
   Add a new movie by copying an object below and filling
   in its fields. status must be "classic" or "upcoming".
   Leave a field as null if it isn't known yet.
--------------------------------------------------------- */
const MOVIES = [
  {
    title: "Jaws",
    year: 1975,
    status: "classic",
    director: "Steven Spielberg",
    cast: ["Roy Scheider", "Robert Shaw", "Richard Dreyfuss"],
    runtimeMinutes: 124,
    budgetUSD: 9000000,
    boxOfficeUSD: 476000000,
    frameRate: 24,
    imdbRating: 8.0,
    synopsis: "A New England beach town hires a shark hunter after a great white begins attacking swimmers."
  },
  {
    title: "Untitled Upcoming Project",
    year: 2027,
    status: "upcoming",
    director: "TBA",
    cast: ["TBA"],
    runtimeMinutes: null,
    budgetUSD: null,
    boxOfficeUSD: null,
    frameRate: null,
    imdbRating: null,
    synopsis: "Placeholder entry — replace with a real upcoming release once details are announced."
  },
{
    title: "Kaiyoppu",
    year: 2007,
    status: "classic",
    director: "Ranjith",
    cast: ["Mammootty", "Khushbu Sundar", "Mukesh", "Nedumudi Venu"],
    runtimeMinutes: 95,
    budgetUSD: null,
    boxOfficeUSD: null,
    frameRate: 24,
    imdbRating: 8.0,
    synopsis: "A literary critic's praise convinces Balachandran, a passionate but struggling writer, that he can finish his novel — but he soon faces the crushing grip of writer's block."
  },
  ];
function money(n){
  if(n === null || n === undefined) return "—";
  return "$" + (n/1000000).toFixed(1) + "M";
}
function runtime(n){
  if(!n) return "—";
  const h = Math.floor(n/60), m = n%60;
  return h + "h " + m + "m";
}
function val(v, suffix=""){
  return (v === null || v === undefined) ? "—" : v + suffix;
}

function renderCard(m){
  return `
  <article class="card" data-status="${m.status}">
    <div class="sprockets"></div>
    <div class="card-head">
      <span class="status ${m.status}">${m.status}</span>
      <h2>${m.title}</h2>
      <div class="year-dir">${m.year} · dir. ${m.director}</div>
    </div>
    <p class="synopsis">${m.synopsis}</p>
    <div class="specs">
      <div class="spec"><span class="label">Budget</span><span class="value">${money(m.budgetUSD)}</span></div>
      <div class="spec"><span class="label">Collection</span><span class="value">${money(m.boxOfficeUSD)}</span></div>
      <div class="spec"><span class="label">Duration</span><span class="value">${runtime(m.runtimeMinutes)}</span></div>
      <div class="spec"><span class="label">Frame Rate</span><span class="value">${val(m.frameRate, " fps")}</span></div>
      <div class="spec"><span class="label">IMDb</span><span class="value">${val(m.imdbRating, " / 10")}</span></div>
      <div class="spec wide"><span class="label">Cast &amp; Crew</span><span class="value">${m.cast.join(", ")}</span></div>
    </div>
  </article>`;
}

function render(filter="all"){
  const grid = document.getElementById("grid");
  const list = filter === "all" ? MOVIES : MOVIES.filter(m => m.status === filter);
  grid.innerHTML = list.map(renderCard).join("");
}

document.querySelectorAll(".filters button").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".filters button").forEach(b=>b.classList.remove("on"));
    btn.classList.add("on");
    render(btn.dataset.filter);
  });
});

render();

/* countdown leader animation */
const leaderSpans = document.querySelectorAll("#leader span");
let i = 0;
setInterval(()=>{
  leaderSpans.forEach(s=>s.classList.remove("active"));
  leaderSpans[i % leaderSpans.length].classList.add("active");
  i++;
}, 500);
</script>

</body>
</html>
